version: 2

project_name: dellkvm
dist: dist

builds:
  - id: dellkvm
    main: ./cmd/dellkvm
    binary: dellkvm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
  - id: dellkvm-windows-cli
    main: ./cmd/dellkvm
    binary: dellkvm
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
  - id: dellkvm-windows-tray
    main: ./cmd/dellkvm
    binary: dellkvm-tray
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -H=windowsgui

archives:
  - id: binaries
    ids:
      - dellkvm
    name_template: "dellkvm_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - config.toml.default
      - integrations/linux/*
      - integrations/omarchy/*
  - id: windows
    ids:
      - dellkvm-windows-cli
      - dellkvm-windows-tray
    name_template: "dellkvm_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - zip
    files:
      - README.md
      - LICENSE
      - config.toml.default

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./install.sh
    - glob: ./installer-artifacts/*.exe

release:
  extra_files:
    - glob: ./install.sh
    - glob: ./installer-artifacts/*.exe

snapshot:
  version_template: "{{ incpatch .Version }}-next"
